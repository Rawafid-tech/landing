<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Rawafid hero mock-up</title>
<link rel="stylesheet" href="./tokens.css" />
<style>

  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { display: flex; font-size: 14px; line-height: 1.45; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.sm { width: 14px; height: 14px; }

  /* Sidebar */
  .sidebar { width: 248px; flex-shrink: 0; height: 100%; display: flex; flex-direction: column; background: var(--sidebar); color: var(--sidebar-foreground); border-inline-end: 1px solid var(--sidebar-border); }
  .brand { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--sidebar-border); }
  .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0; }
  .brand-mark svg { width: 30px; height: 36px; }
  .brand-name { font-size: 14px; font-weight: 700; }
  .brand-tag { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .collapse { margin-inline-start: auto; color: var(--muted-foreground); }
  nav { flex: 1; min-height: 0; overflow: hidden; padding: 10px 8px; }
  .nav-group + .nav-group { margin-top: 10px; }
  .nav-group ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .nav-heading { margin-bottom: 4px; padding: 0 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: color-mix(in srgb, var(--muted-foreground) 80%, transparent); }
  .nav-item { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: var(--radius); font-size: 13.5px; font-weight: 500; }
  .nav-item.active { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
  .nav-item.active::before { content: ""; position: absolute; inset-block: 4px; inset-inline-start: 0; width: 2px; border-radius: 99px; background: var(--sidebar-primary); }
  .plan { margin: 10px 12px; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--sidebar-border); background: color-mix(in srgb, var(--sidebar-accent) 50%, transparent); }
  .plan p:first-child { font-size: 11px; color: var(--muted-foreground); }
  .plan p:last-child { font-size: 13.5px; font-weight: 600; }

  /* Main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header.top { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--background); }
  .crumbs { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-foreground); }
  .crumbs b { color: var(--foreground); font-weight: 500; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font-size: 12.5px; font-weight: 500; color: var(--foreground); white-space: nowrap; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; position: relative; }
  .btn.pill { border-radius: 999px; padding-inline-start: 4px; }
  .dot { position: absolute; top: 6px; inset-inline-end: 7px; width: 7px; height: 7px; border-radius: 99px; background: var(--destructive); box-shadow: 0 0 0 2px var(--card); }
  .chip-ico { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary); }
  .avatar { width: 24px; height: 24px; border-radius: 99px; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; background: color-mix(in srgb, var(--primary) 10%, transparent); color: var(--primary); }

  .content { flex: 1; padding: 22px 24px 0; overflow: hidden; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 16px; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
  .tab.active { border-color: var(--primary); color: var(--foreground); }
  .count { min-width: 20px; padding: 0 6px; border-radius: 99px; font-size: 11.5px; text-align: center; background: var(--muted); color: var(--muted-foreground); }
  .tab.active .count { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); }

  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); overflow: hidden; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); }
  .search { flex: 1; min-width: 220px; max-width: 300px; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--input); border-radius: var(--radius); color: var(--muted-foreground); font-size: 12.5px; background: var(--background); }
  .spacer { flex: 1; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: start; font-weight: 500; font-size: 12px; color: var(--muted-foreground); padding: 9px 10px; background: color-mix(in srgb, var(--muted) 60%, transparent); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
  tr.sel td { background: color-mix(in srgb, var(--primary) 5%, transparent); }
  .cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--muted-foreground) 50%, transparent); display: grid; place-items: center; }
  .cb.on { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  .cb.on svg { width: 11px; height: 11px; stroke-width: 3; }
  .link { color: var(--primary); font-weight: 500; }
  .strong { font-weight: 500; }
  .sub { font-size: 11.5px; color: var(--muted-foreground); }
  .conn { display: flex; align-items: center; gap: 8px; }
  .mono { width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--radius); display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: "Inter", sans-serif; }
  .logo-tile { width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); background: #fff; padding: 3px; object-fit: contain; }
  .badges { display: flex; gap: 4px; align-items: center; }

  .b-warning { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning-text); }
  .b-secondary { background: var(--secondary); color: var(--secondary-foreground); }
  .b-outline { border: 1px solid var(--border); font-weight: 400; }
  .muted { color: var(--muted-foreground); }
</style>
</head>

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  printer: '<path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/>',
  sort: '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
};
const icon = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[name]}</svg>`;

// Rawafid brand mark (landing/src/lib/brand-logo.ts).
document.getElementById("mark").innerHTML = `
  <svg viewBox="9 6 248 299" fill="none">
    <defs><linearGradient id="g" x1="20" y1="300" x2="250" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--logo-1)"/><stop offset=".38" stop-color="var(--logo-2)"/>
      <stop offset=".68" stop-color="var(--logo-3)"/><stop offset="1" stop-color="var(--logo-4)"/></linearGradient></defs>
    <g stroke="url(#g)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 180V110Q24 66 68 66H140"/><path d="M24 262C24 225 50 188 95 145"/>
      <path d="M24 262V270A20 20 0 0 0 64 270V254C64 214 102 170 153 147"/><path d="M153 147C153 120 158 104 168 94L218 46"/>
      <path d="M101 226L160 283H232L95 145"/><path d="M212 105V165C212 192 190 212 160 210"/>
    </g>
    <g fill="url(#g)"><circle cx="150" cy="60" r="19"/><circle cx="95" cy="145" r="19"/><circle cx="153" cy="147" r="19"/><circle cx="212" cy="105" r="19"/>
    <path d="M250 13L236.5 67.5L196.5 27.5Z"/></g>
  </svg>`;

document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[el.dataset.t]; });
document.querySelectorAll("[data-icon]").forEach((el) => {
  const name = el.dataset.icon === "theme" ? (theme === "dark" ? "sun" : "moon") : el.dataset.icon;
  el.innerHTML = icon(name, name === "chev" ? "sm" : "");
});

// Order matches MERCHANT_NAV_ITEMS in r-dashboard/src/shared/components/layout/merchant-nav.ts (trimmed to fit).
const NAV_GROUPS = [
  ["overview", ["dashboard"]],
  ["operations", ["orders", "shipments", "returns", "exchanges"]],
  ["catalog", ["products", "shippingBoxes"]],
  ["shipping", ["shippingPartners", "locations"]],
  ["finance", ["wallet", "billing"]],
  ["account", ["users", "roles", "settings"]],
];
const navItem = (key) =>
  `<li class="nav-item ${key === "shipments" ? "active" : ""}">${icon(key)}<span>${T.nav[key]}</span></li>`;
document.getElementById("nav").innerHTML = NAV_GROUPS.map(([group, keys]) =>
  `<div class="nav-group">${group === "overview" ? "" : `<p class="nav-heading">${T.navGroups[group]}</p>`}<ul>${keys.map(navItem).join("")}</ul></div>`).join("");

const num = (n) => n.toLocaleString(lang === "ar" ? "ar-EG" : "en-US");
document.getElementById("tabs").innerHTML = Object.keys(COUNTS).map((key) =>
  `<div class="tab ${key === "CURRENTLY_SHIPPING" ? "active" : ""}">${T.tabs[key]}<span class="count tabular">${COUNTS[key].toLocaleString("en-US")}</span></div>`).join("");

const money = (n) => new Intl.NumberFormat(intl, { style: "currency", currency: "EGP" }).format(n);
const date = (iso) => new Intl.DateTimeFormat(intl, { day: "numeric", month: "short" }).format(new Date(iso));
document.getElementById("balance").textContent = money(18450);
document.getElementById("range").textContent = `${date("2026-10-01")} – ${date("2026-10-30")}`;


const li = lang === "ar" ? 0 : 1;
document.getElementById("thead").innerHTML =
  `<th style="width:36px"><span class="cb"></span></th>` + T.cols.map((c) => `<th>${c}</th>`).join("") + `<th></th>`;
document.getElementById("tbody").innerHTML = ROWS.map((r) => {
  const tint = CARRIER_TINT[r.carrier];
  const mark = CARRIER_LOGO[r.carrier]
    ? `<img class="logo-tile" src="${CARRIER_LOGO[r.carrier]}" alt="" />`
    : `<span class="mono" style="background:color-mix(in srgb, ${tint} 14%, transparent);color:${tint}">${CARRIER_MONO[r.carrier]}</span>`;
  const kindBadge = r.kind ? `<span class="badge b-outline">${T.kind[r.kind]}</span>` : "";
  return `<tr class="${r.sel ? "sel" : ""}">
    <td><span class="cb ${r.sel ? "on" : ""}">${r.sel ? icon("check") : ""}</span></td>
    <td><span class="link tabular">#${r.order}</span></td>
    <td><span class="link tabular" dir="ltr">${r.tracking}</span></td>
    <td><p class="strong">${r.name[li]}</p><p class="sub tabular" dir="ltr">${r.phone}</p></td>
    <td><div class="conn">${mark}
      <div><p class="strong">${r.conn[li]}</p><p class="sub">${T.carriers[r.carrier]}</p></div></div></td>
    <td class="tabular strong">${money(r.cod)}</td>
    <td><div class="badges">${kindBadge}<span class="badge b-warning">${T.status[r.status]}</span></div><p class="sub">${r.state[li]}</p></td>
    <td class="tabular muted">${date(r.date)}</td>
    <td class="muted">${icon("more")}</td>
  </tr>`;
}).join("");
</script>
</body>
</html>
