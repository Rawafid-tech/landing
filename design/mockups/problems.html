<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<title>Rawafid problem illustrations</title>
<link rel="stylesheet" href="./tokens.css" />
<style>
  /* One 16:10 scene per Problem card; pick it with ?scene=<key>. Rendered at 960x600. */
  html, body { width: 960px; height: 600px; overflow: hidden; background: #eef3fb; }
  svg { display: block; width: 960px; height: 600px; font-family: "Cairo", "Inter", sans-serif; }
  .scene { display: none; }
  .scene.on { display: inline; }
</style>
</head>
<body>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#e3ebf8" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#c7d4ea" />
    </pattern>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1d63e0" />
      <stop offset=".6" stop-color="#0e9bd8" />
      <stop offset="1" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="pain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".13" />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12" />
    </filter>
    <symbol id="qbubble" viewBox="0 0 64 64">
      <path d="M32 4a26 26 0 0 1 0 52h-2l-12 8 3-10A26 26 0 0 1 32 4z" fill="url(#pain)" />
      <text x="32" y="43" text-anchor="middle" font-family="Inter" font-size="34" font-weight="800" fill="#fff">?</text>
    </symbol>
    <symbol id="parcel" viewBox="0 0 120 110">
      <path d="M60 4 112 30v52L60 108 8 82V30z" fill="#d6a76c" />
      <path d="M60 4 112 30 60 56 8 30z" fill="#e8c18f" />
      <path d="M60 56v52L8 82V30z" fill="#c8945a" />
      <path d="M34 17 86 43v18l-10-5V48L24 22z" fill="#f3dcb6" />
    </symbol>
  </defs>

  <rect width="960" height="600" fill="url(#bg)" />
  <rect width="960" height="600" fill="url(#dots)" opacity=".7" />

  <!-- 1. Multiple dashboards: a separate portal per carrier -->

      <g fill="#cbd5e1"><rect x="24" y="132" width="80" height="12" rx="6" /><rect x="130" y="132" width="120" height="12" rx="6" /><rect x="24" y="172" width="70" height="12" rx="6" /><rect x="130" y="172" width="140" height="12" rx="6" /><rect x="24" y="212" width="90" height="12" rx="6" /><rect x="130" y="212" width="100" height="12" rx="6" /></g>
      <rect x="300" y="128" width="76" height="20" rx="10" fill="#fef3c7" /><rect x="300" y="168" width="76" height="20" rx="10" fill="#dcfce7" /><rect x="300" y="208" width="76" height="20" rx="10" fill="#fee2e2" />

      <circle cx="110" cy="110" r="42" fill="none" stroke="#ede9fe" stroke-width="18" />
      <path d="M110 68a42 42 0 0 1 40 30" fill="none" stroke="#7c3aed" stroke-width="18" />
    </g>
    <!-- login prompts everywhere -->
    <g transform="translate(96 404)" filter="url(#soft)">
      <rect width="150" height="96" rx="12" fill="#0f172a" />
      <rect x="18" y="20" width="114" height="16" rx="5" fill="#334155" />
      <g fill="#94a3b8"><circle cx="30" cy="62" r="5" /><circle cx="48" cy="62" r="5" /><circle cx="66" cy="62" r="5" /><circle cx="84" cy="62" r="5" /><circle cx="102" cy="62" r="5" /></g>

  <!-- 3. Difficult returns: boxes looping back with no clear status -->

      <circle cx="70" cy="196" r="30" fill="#0f172a" /><circle cx="70" cy="196" r="12" fill="#94a3b8" />

  </g>
